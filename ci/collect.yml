name: Collect slate

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests must pass before collecting
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_data.py --strict

      - name: Rebuild the surface map from source match data
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build_surface_map.mjs

      - name: Collect OLBG slate
        id: collect
        continue-on-error: true
        run: |
          python3 scripts/collect_olbg.py \
            --save-html tests/fixtures/captures \
            --enrich \
            --enrich-limit 25

      - name: Report a failed collection without failing the run
        if: steps.collect.outcome == 'failure'
        run: echo "::warning::OLBG collection failed. data/slate.json is unchanged."

      - name: Collect OLBG cricket slate
        id: collect-cricket
        continue-on-error: true
        run: python3 scripts/collect_cricket_olbg.py

      - name: Report a failed cricket collection
        if: steps.collect-cricket.outcome == 'failure'
        run: echo "::warning::OLBG cricket collection failed. data/cricket_slate.json is unchanged."

      - name: Validate cricket prediction ledger
        continue-on-error: true
        run: node scripts/record_cricket_predictions.mjs

      - name: Collect player statistics
        continue-on-error: true
        run: python3 scripts/collect_players.py --from-slate || true

      - name: Collect from ESPN and settle results
        id: espn
        continue-on-error: true
        run: node scripts/collect_espn.mjs

      - name: Report a failed ESPN collection
        if: steps.espn.outcome == 'failure'
        run: echo "::warning::ESPN collection failed. Recorded data is unchanged."

      - name: Collect OLBG sports directory
        id: olbg-sports
        continue-on-error: true
        run: python3 scripts/collect_olbg_sports.py

      - name: Collect F1 OLBG slate
        id: collect-f1-olbg
        continue-on-error: true
        run: |
          python3 scripts/collect_f1_olbg.py \
            --save-html tests/fixtures/captures \
            --enrich \
            --enrich-limit 25

      - name: Report a failed F1 OLBG collection
        if: steps.collect-f1-olbg.outcome == 'failure'
        run: echo "::warning::F1 OLBG collection failed. data/f1_slate.json is unchanged."

      - name: Collect F1 ESPN events & standings
        id: collect-f1-espn
        continue-on-error: true
        run: node scripts/collect_f1_espn.mjs

      - name: Report a failed F1 ESPN collection
        if: steps.collect-f1-espn.outcome == 'failure'
        run: echo "::warning::F1 ESPN collection failed. Recorded F1 data is unchanged."

      - name: Collect F1 weather
        id: collect-f1-weather
        continue-on-error: true
        run: node scripts/collect_f1_weather.mjs

      - name: Report a failed F1 weather collection
        if: steps.collect-f1-weather.outcome == 'failure'
        run: echo "::warning::F1 weather collection failed. data/f1_weather.json is unchanged."

      - name: F1 walk-forward backtest and ledger
        continue-on-error: true
        run: node scripts/backtest_f1.mjs

      - name: Collect OLBG golf slate
        id: collect-golf-olbg
        continue-on-error: true
        run: |
          python3 scripts/collect_golf_olbg.py \
            --save-html tests/fixtures/captures \
            --enrich \
            --enrich-limit 25

      - name: Report a failed golf OLBG collection
        if: steps.collect-golf-olbg.outcome == 'failure'
        run: echo "::warning::Golf OLBG collection failed. data/golf_slate.json is unchanged."

      - name: Collect golf events, results tape, rankings and statistics
        id: collect-golf-espn
        continue-on-error: true
        run: |
          if [ ! -f data/golf_results.json ]; then
            node scripts/collect_golf_espn.mjs --history
          else
            node scripts/collect_golf_espn.mjs
          fi

      - name: Report a failed golf ESPN collection
        if: steps.collect-golf-espn.outcome == 'failure'
        run: echo "::warning::Golf ESPN/OWGR collection failed. Recorded golf data is unchanged."

      - name: Collect golf weather
        id: collect-golf-weather
        continue-on-error: true
        run: node scripts/collect_golf_weather.mjs

      - name: Report a failed golf weather collection
        if: steps.collect-golf-weather.outcome == 'failure'
        run: echo "::warning::Golf weather collection failed. data/golf_weather.json is unchanged."

      - name: Golf walk-forward backtest and ledger
        continue-on-error: true
        run: node scripts/backtest_golf.mjs

      - name: Collect OLBG volleyball slate
        id: collect-volleyball-olbg
        continue-on-error: true
        run: python3 scripts/collect_volleyball_olbg.py

      - name: Report a failed volleyball OLBG collection
        if: steps.collect-volleyball-olbg.outcome == 'failure'
        run: echo "::warning::OLBG volleyball collection failed. data/volleyball_slate.json is unchanged."

      - name: Collect official FIVB VNL Women fixtures and results
        id: collect-volleyball-vnl
        continue-on-error: true
        run: python3 scripts/collect_volleyball_vnl.py

      - name: Report a failed official VNL collection
        if: steps.collect-volleyball-vnl.outcome == 'failure'
        run: echo "::warning::Official VNL Women collection failed or found no complete source rows. The prior VNL snapshot is unchanged."

      - name: Record source-gated VNL Women predictions
        continue-on-error: true
        run: node scripts/record_volleyball_predictions.mjs

      - name: VNL Women walk-forward backtest
        continue-on-error: true
        run: node scripts/backtest_volleyball.mjs

      - name: Collect OLBG rugby league slate
        id: collect-rugby-league-olbg
        continue-on-error: true
        run: python3 scripts/collect_rugby_league_olbg.py --enrich

      - name: Report a failed rugby league OLBG collection
        if: steps.collect-rugby-league-olbg.outcome == 'failure'
        run: echo "::warning::OLBG rugby league collection failed. data/rugby_league_slate.json is unchanged."

      - name: Record predictions against the OLBG slate
        continue-on-error: true
        run: node scripts/record_predictions.mjs

      - name: Backtest report
        run: |
          node scripts/backtest.mjs
          python3 scripts/build_data.py --strict

      - name: Commit data changes
        run: |
          git config user.name "sportspred-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git reset -q tests/fixtures/captures 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh slate and recorded predictions"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt ${attempt} rejected by a concurrent data commit; retrying"
              sleep $((attempt * 5))
            done
            [ "${pushed}" = 1 ]
          fi
