name: Collect golf data

# Collects the golf layer (OLBG golf slate, ESPN events/results tape, OWGR
# rankings, ESPN season statistics, PGA TOUR strokes gained, Open-Meteo
# weather), runs the walk-forward backtest and commits the refreshed data.
#
# Runs on every push to the golf work branch so the data files can be generated
# and reviewed before merge, and on the default branch schedule via the main
# collect.yml (this file is kept branch-scoped to avoid double collection).

on:
  push:
    branches: [arena/01a0603d-sportspred]
  workflow_dispatch:
    inputs:
      history:
        description: 'Rebuild the two-season results tape (--history)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: golf-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests must pass before collecting
        run: |
          npm ci
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_data.py --strict

      - name: Collect OLBG golf slate
        id: collect-golf-olbg
        continue-on-error: true
        run: |
          python3 scripts/collect_golf_olbg.py \
            --save-html tests/fixtures/captures \
            --enrich \
            --enrich-limit 25

      - name: Report a failed golf OLBG collection
        if: steps.collect-golf-olbg.outcome == 'failure'
        run: echo "::warning::Golf OLBG collection failed. data/golf_slate.json is unchanged."

      - name: Collect golf events, results tape, rankings and statistics
        id: collect-golf-espn
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.history }}" = "true" ] || [ ! -f data/golf_results.json ]; then
            node scripts/collect_golf_espn.mjs --history
          else
            node scripts/collect_golf_espn.mjs
          fi

      - name: Report a failed golf ESPN collection
        if: steps.collect-golf-espn.outcome == 'failure'
        run: echo "::warning::Golf ESPN/OWGR collection failed. Recorded golf data is unchanged."

      - name: Collect golf weather
        id: collect-golf-weather
        continue-on-error: true
        run: node scripts/collect_golf_weather.mjs

      - name: Report a failed golf weather collection
        if: steps.collect-golf-weather.outcome == 'failure'
        run: echo "::warning::Golf weather collection failed. data/golf_weather.json is unchanged."

      - name: Golf walk-forward backtest and ledger
        continue-on-error: true
        run: node scripts/backtest_golf.mjs

      - name: Validate the golf layer
        run: python3 scripts/build_data.py --strict

      - name: Commit golf data changes
        run: |
          git config user.name "sportspred-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git reset -q tests/fixtures/captures 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No golf data changes to commit."
          else
            git commit -m "chore(data): refresh golf slate, events, results tape, rankings, stats and weather"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
