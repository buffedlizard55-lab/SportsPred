name: Deploy site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Show environment
        run: |
          echo "Node: $(node --version)"
          echo "Python: $(python3 --version)"

      - name: Run Node tests before publishing
        run: |
          set +e
          node --version
          {
            echo "=== node version ==="; node --version
            echo "=== npm test ==="; npm test 2>&1
            echo "=== per-file run ==="
            for f in tests/*.test.mjs; do
              echo "--- $f ---"
              node --test "$f" 2>&1 | tail -15
            done
          } | tee /tmp/ci-debug.log
          exit ${PIPESTATUS[0]}

      - name: Upload CI debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-log
          path: /tmp/ci-debug.log
          if-no-files-found: ignore

      - name: Run Python tests before publishing
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate committed data layer
        run: python3 scripts/build_data.py --strict

      - name: Assemble site artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r engine _site/
          cp -r data _site/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
