name: Deploy site

on:
  push:
    branches: [main, arena/01a05564-sportspred]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests before publishing
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      # Assemble a clean artifact. Publishing the whole checkout would expose
      # scripts, tests and any captured HTML fixtures to the public site.
      - name: Assemble site artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r engine _site/
          cp -r data   _site/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
