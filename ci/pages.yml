name: Deploy site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Show environment
        run: |
          echo "Node: $(node --version)"
          echo "Python: $(python3 --version)"

      - name: Run Node tests before publishing
        shell: bash
        run: |
          node --version
          rc=0
          : > /tmp/node-test.log
          for f in tests/*.test.mjs; do
            echo "===== $f =====" | tee -a /tmp/node-test.log
            if node --test "$f" >> /tmp/node-test.log 2>&1; then
              echo "PASS $f" | tee -a /tmp/node-test.log
            else
              echo "::error::TEST_FAILURE in $f"
              echo "FAIL $f" | tee -a /tmp/node-test.log
              grep -E "not ok|# fail|Error:|Cannot find|SyntaxError|ReferenceError|TypeError|ERR_TEST_FAILURE|code:|message:|exitCode" /tmp/node-test.log | head -20
              rc=1
            fi
          done
          echo "----- SUMMARY -----" | tee -a /tmp/node-test.log
          grep -E "^# (tests|pass|fail)" /tmp/node-test.log | tail -20 | tee -a /tmp/node-test.log
          exit $rc

      - name: Upload Node test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-log
          path: /tmp/node-test.log
          if-no-files-found: ignore

      - name: Run Python tests before publishing
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate committed data layer
        run: python3 scripts/build_data.py --strict

      - name: Assemble site artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r engine _site/
          cp -r data _site/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
