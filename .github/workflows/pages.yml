name: Deploy site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Show environment
        run: |
          echo "Node: $(node --version)"
          echo "Python: $(python3 --version)"

      - name: Run Node tests before publishing
        shell: bash
        run: |
          node --version
          # Run every test file in a SINGLE node --test process. Top-level-await
          # tests (olbg/integration) load correctly in one invocation and across
          # Node 20/22/24; running each file in its own subprocess breaks TLA on
          # the forced Node 24 runners. The wrapper keeps that single process and
          # additionally mirrors any failure into check annotations, because job
          # logs are served from blob storage that is not always reachable.
          node scripts/ci_node_tests.mjs

      - name: Run Python tests before publishing
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate committed data layer
        run: python3 scripts/build_data.py --strict

      # The T20 Blast tape is rebuilt from verified sources and re-checked on
      # every push: nine machine checks over the results tape (points
      # arithmetic, net run rate recomputed from published figures, the Sussex
      # deduction, pairing counts against declared gaps, knockout event ids).
      - name: Verify the T20 Blast tape line by line
        run: node scripts/build_t20_blast.mjs --check

      # Walk-forward replay of the whole season. Fails if the look-ahead audit
      # trips, if the metric counts stop reconciling, or if the publication gate
      # and its triggers disagree. The gate is what caps published confidence,
      # so a silent change here would change what the site claims.
      - name: Backtest the T20 Blast model and verify its publication gate
        run: node scripts/backtest_t20_blast.mjs --check

      # The Scottish Open overlay's curated inputs are re-derived and compared
      # on every push: the cited links/coastal venue table (a course is never
      # classified from its name), the venue dossier whose every claim carries a
      # named primary source and a CONFIRMED or UNCONFIRMED status, and the
      # walk-forward ledger over the editions in the committed results tape.
      - name: Verify the Scottish Open overlay line by line
        run: |
          node scripts/build_golf_links.mjs --check
          node scripts/build_scottish_open.mjs --check
          node scripts/backtest_scottish_open.mjs --check

      - name: Verify the site line by line (selectors, links, JSON, modules)
        run: node scripts/verify_site.mjs

      - name: Assemble site artifact
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp .nojekyll _site/ 2>/dev/null || true
          cp -r assets _site/
          cp -r engine _site/
          cp -r data _site/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
