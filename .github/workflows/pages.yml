name: Deploy site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Show environment
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Python: $(python3 --version)"
          ls -la data/ | grep cricket || true

      - name: Run Node tests before publishing
        run: |
          node --version
          echo "--- glob expansion of tests/*.test.mjs ---"
          ls tests/*.test.mjs | wc -l
          echo "--- running node --test directly ---"
          node --test tests/*.test.mjs 2>&1 | tail -40
        shell: bash

      - name: Run Python tests before publishing
        run: |
          python3 --version
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate committed data layer
        run: python3 scripts/build_data.py --strict

      - name: Assemble site artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r engine _site/
          cp -r data _site/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
