name: Collect NRL data

# Refreshes the NRL layer that backs nrl.html:
#   data/nrl_matches.json      the season tape (results + fixtures) from ESPN's
#                              key-less site API, merged into the committed tape
#   data/nrl_weather.json      venue forecasts from Open-Meteo (no key)
#   data/nrl_backtest.json     walk-forward backtest over rounds 7-27
#   data/nrl_predictions.json  the forward ledger, then settled against the tape
#
# The development sandbox has no outbound network, so this collector only ever
# runs here. A failed fetch leaves the committed documents untouched and exits
# non-zero so the failure is visible: the collectors merge, they never replace a
# good tape with an empty one.

on:
  push:
    branches: [arena/01a069ef-sportspred]
  schedule:
    # NRL rounds run Thursday to Sunday; 04:00 UTC is mid-afternoon in
    # Australia, after the previous night's results are published.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nrl-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests must pass before collecting
        run: |
          node scripts/ci_node_tests.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_data.py --strict

      - name: Refresh the tape from ESPN
        id: espn
        continue-on-error: true
        run: node scripts/collect_nrl_espn.mjs

      - name: Report a failed ESPN collection
        if: steps.espn.outcome == 'failure'
        run: echo "::warning::ESPN NRL collection failed. The committed tape is unchanged (the collector never overwrites with partial data)."

      - name: Refresh the venue forecasts
        id: weather
        continue-on-error: true
        run: node scripts/collect_nrl_weather.mjs

      - name: Report a failed forecast fetch
        if: steps.weather.outcome == 'failure'
        run: echo "::warning::Open-Meteo fetch failed. The committed forecast is unchanged."

      - name: Validate the refreshed tape
        run: node scripts/collect_nrl_espn.mjs --check

      - name: Walk the backtest forward and record the forward ledger
        run: |
          node scripts/backtest_nrl.mjs
          node scripts/record_nrl_predictions.mjs
          node scripts/settle_nrl.mjs

      - name: Validate the whole data layer
        run: python3 scripts/build_data.py --strict

      - name: Commit NRL data changes
        run: |
          git config user.name "sportspred-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nrl_*.json
          if git diff --cached --quiet || ! node scripts/data_changed.mjs $(git diff --cached --name-only); then
            echo "No NRL data changes to commit (unchanged or timestamps only)."
            git reset -q
          else
            git commit -m "chore(data): refresh NRL tape, forecasts, backtest and forward ledger"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt ${attempt} rejected by a concurrent data commit; retrying"
              sleep $((attempt * 5))
            done
            [ "${pushed}" = "1" ]
          fi
