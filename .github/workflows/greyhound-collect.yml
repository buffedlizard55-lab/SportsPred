name: Collect greyhound data

# Collects the greyhound layer from the official GBGB results API
# (meetings/draws/results for the collection window, per-dog form histories for
# every upcoming runner), walks-forward the backtest over settled races and
# commits the refreshed data. Also refreshes the OLBG greyhound slate.
#
# Runs on push to this work branch and on a schedule on the default branch.

on:
  push:
    branches: [arena/01a06370-sportspred]
  schedule:
    - cron: '7,37 * * * *'   # twice an hour; GBGB cards land through the evening
  workflow_dispatch:
    inputs:
      history:
        description: 'Rebuild a longer meeting window (--backtest 60)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: greyhound-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests must pass before collecting
        run: |
          npm ci
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_data.py --strict

      - name: Collect GBGB meetings, draws, results and dog histories
        id: collect-gbgb
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.history }}" = "true" ]; then
            node scripts/collect_greyhound.mjs --backtest 60
          else
            node scripts/collect_greyhound.mjs
          fi

      - name: Report a failed GBGB collection
        if: steps.collect-gbgb.outcome == 'failure'
        run: echo "::warning::GBGB collection failed. Committed greyhound data is unchanged."

      - name: Collect OLBG greyhound slate
        id: collect-olbg
        continue-on-error: true
        run: python3 scripts/collect_greyhound_olbg.py --enrich || true

      - name: Report a failed OLBG slate collection
        if: steps.collect-olbg.outcome == 'failure'
        run: echo "::warning::OLBG greyhound slate collection failed; slate unchanged."

      - name: Greyhound walk-forward backtest
        continue-on-error: true
        run: node scripts/backtest_greyhound.mjs

      - name: Validate the greyhound layer
        run: python3 scripts/build_data.py --strict

      - name: Commit greyhound data changes
        run: |
          git config user.name "sportspred-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet || ! node scripts/data_changed.mjs $(git diff --cached --name-only); then
            echo "No greyhound data changes to commit (unchanged or timestamps only)."
            git reset -q
          else
            git commit -m "chore(data): refresh greyhound meetings, histories, slate and backtest"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt ${attempt} rejected by a concurrent data commit; retrying"
              sleep $((attempt * 5))
            done
            [ "${pushed}" = "1" ]
          fi
