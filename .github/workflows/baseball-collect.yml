name: Collect baseball data

# Refreshes the baseball layer from the official MLB StatsAPI (fixtures,
# standings, team batting/pitching stats, probable-starter profiles) and ESPN
# (venue/weather context), refreshes the OLBG baseball slate, walks the backtest
# forward over settled games and commits the result.
#
# The sandbox this project is developed in has no outbound network, so these
# collectors only ever run here. A failed collection leaves the committed data
# untouched rather than writing a partial file.

on:
  push:
    branches: [arena/01a065a2-sportspred]
  schedule:
    - cron: '24,54 * * * *'   # twice an hour through the MLB evening
  workflow_dispatch:
    inputs:
      days:
        description: 'Fixture and results window in days either side of today'
        required: false
        default: '21'

permissions:
  contents: write

concurrency:
  group: baseball-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same gate precompute.yml uses: the whole Node suite (the jsdom DOM tests
      # self-skip when jsdom is absent), the Python unit tests, and the data
      # validators.
      - name: Tests must pass before collecting
        run: |
          node scripts/ci_node_tests.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_data.py --strict

      - name: Collect MLB fixtures, standings, team stats and pitchers
        id: collect-mlb
        continue-on-error: true
        run: node scripts/collect_baseball_mlb.mjs --days "${{ github.event.inputs.days || '21' }}"

      - name: Report a failed MLB collection
        if: steps.collect-mlb.outcome == 'failure'
        run: echo "::warning::MLB collection failed. Committed baseball data is unchanged."

      - name: Collect the OLBG baseball slate
        id: collect-olbg
        continue-on-error: true
        run: python3 scripts/collect_baseball_olbg.py --enrich || true

      - name: Report a failed OLBG slate collection
        if: steps.collect-olbg.outcome == 'failure'
        run: echo "::warning::OLBG baseball slate collection failed; slate unchanged."

      - name: Baseball walk-forward backtest
        continue-on-error: true
        run: node scripts/backtest_baseball.mjs

      - name: Record the forward ledger
        id: record
        continue-on-error: true
        run: node scripts/record_baseball_predictions.mjs

      - name: Report a failed ledger record
        if: steps.record.outcome == 'failure'
        run: echo "::warning::baseball ledger recording failed; committed ledger unchanged."

      - name: Validate the baseball layer
        run: python3 scripts/build_data.py --strict

      - name: Commit baseball data changes
        run: |
          git config user.name "sportspred-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet || ! node scripts/data_changed.mjs $(git diff --cached --name-only); then
            echo "No baseball data changes to commit (unchanged or timestamps only)."
            git reset -q
          else
            git commit -m "chore(data): refresh baseball fixtures, standings, team stats, pitchers, slate and backtest"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt ${attempt} rejected by a concurrent data commit; retrying"
              sleep $((attempt * 5))
            done
            [ "${pushed}" = "1" ]
          fi
